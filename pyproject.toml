[project]
name = "redpent-tools"
version = "0.1.0"
description = "MCP server wrapping a reconnaissance / web-security toolset (authorized assessments only)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "mmh3>=4.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
redpent-tools = "redpent_tools.server:main"
redpent-tools-install = "redpent_tools.installer:main"
redpent-tools-keygen = "redpent_tools.server:keygen"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["redpent_tools", "redpent_tools.tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
